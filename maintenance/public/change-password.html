<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Actualizar contraseña | Plataforma de Mantenimiento</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.min.css">
  <link rel="stylesheet" href="./assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark" aria-hidden="true">M</span>
      <span class="auth-card__brand-name">Estrategia Urbana</span>
    </div>

    <h1>Actualiza tu contraseña</h1>
    <p class="auth-card__intro">Por seguridad, debes establecer una contraseña personal antes de utilizar la plataforma.</p>

    <div class="auth-card__notice">
      La nueva contraseña debe tener al menos 12 caracteres y combinar tres de los siguientes tipos:
      <ul class="password-requirements">
        <li>Letras minúsculas</li>
        <li>Letras mayúsculas</li>
        <li>Números</li>
        <li>Símbolos</li>
      </ul>
    </div>

    <form class="form" data-password-form novalidate>
      <label class="form-field">
        Contraseña temporal
        <input type="password" name="current_password" autocomplete="current-password" required>
      </label>

      <label class="form-field">
        Nueva contraseña
        <input type="password" name="new_password" autocomplete="new-password" required minlength="12">
      </label>

      <label class="form-field">
        Confirmar nueva contraseña
        <input type="password" name="new_password_confirmation" autocomplete="new-password" required minlength="12">
      </label>

      <button class="button button--primary" type="submit">Guardar contraseña</button>
    </form>

    <p class="message" data-message role="alert" aria-live="polite"></p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>
  <script type="module" src="./assets/js/modules/change-password.js"></script>
</body>
</html>
