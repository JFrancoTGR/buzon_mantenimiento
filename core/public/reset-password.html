<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="/assets/js/components/theme-preload.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Restablecer contraseña | EU Tools</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.min.css"
  >

  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card--wide">
    <div class="auth-card__brand">
      <span class="auth-card__mark" aria-hidden="true">EU</span>
      <span class="auth-card__brand-name">Estrategia Urbana</span>
    </div>

    <p class="eyebrow">Cuenta EU Tools</p>

    <section data-reset-loading>
      <div class="verification-state">
        <div
          class="verification-state__spinner"
          aria-hidden="true"
        ></div>

        <h1>Validando enlace</h1>

        <p class="auth-card__intro">
          Espera un momento mientras verificamos la solicitud.
        </p>
      </div>
    </section>

    <section data-reset-form-section hidden>
      <h1>Restablece tu contraseña</h1>

      <p class="auth-card__intro">
        Hola <strong data-reset-name></strong>.
        Crea una nueva contraseña para tu cuenta.
      </p>

      <div class="auth-card__notice">
        <strong>Cuenta</strong>
        <span data-reset-email></span>

        <span class="auth-card__notice-detail">
          El enlace vence el
          <span data-reset-expiry></span>
        </span>
      </div>

      <form class="form" data-reset-form novalidate>
        <label class="form-field">
          Nueva contraseña

          <input
            type="password"
            name="password"
            autocomplete="new-password"
            minlength="12"
            required
          >

          <span class="form-help">
            Utiliza al menos 12 caracteres y combina tres tipos:
            minúsculas, mayúsculas, números o símbolos.
          </span>
        </label>

        <label class="form-field">
          Confirmar contraseña

          <input
            type="password"
            name="password_confirmation"
            autocomplete="new-password"
            minlength="12"
            required
          >
        </label>

        <button
          class="button button--primary"
          type="submit"
          data-submit-button
        >
          Restablecer contraseña
        </button>
      </form>

      <p
        class="message"
        data-message
        role="alert"
        aria-live="polite"
      ></p>
    </section>

    <section
      class="verification-state"
      data-reset-error
      hidden
    >
      <div
        class="verification-state__icon verification-state__icon--error"
        aria-hidden="true"
      >
        !
      </div>

      <h1>El enlace no está disponible</h1>

      <p
        class="auth-card__intro"
        data-error-message
      ></p>

      <div class="verification-state__actions">
        <a
          class="button button--secondary"
          href="/forgot-password"
        >
          Solicitar un nuevo enlace
        </a>
      </div>
    </section>
  </main>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"
  ></script>

  <script
    type="module"
    src="/assets/js/modules/reset-password.js"
  ></script>
</body>
</html>
