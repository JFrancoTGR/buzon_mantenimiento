<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>Cambiar contraseña | EU Tools</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.min.css"
  >

  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark" aria-hidden="true">EU</span>
      <span class="auth-card__brand-name">Estrategia Urbana</span>
    </div>

    <p class="eyebrow">Seguridad de cuenta</p>

    <h1>Cambiar contraseña</h1>

    <p class="auth-card__intro">
      Al guardar la nueva contraseña cerraremos todas las sesiones abiertas.
    </p>

    <form class="form" data-password-form novalidate>
      <label class="form-field">
        Contraseña actual

        <input
          type="password"
          name="current_password"
          autocomplete="current-password"
          required
        >
      </label>

      <label class="form-field">
        Nueva contraseña

        <input
          type="password"
          name="new_password"
          autocomplete="new-password"
          minlength="12"
          required
        >

        <span class="form-help">
          Utiliza al menos 12 caracteres y combina tres tipos:
          minúsculas, mayúsculas, números o símbolos.
        </span>
      </label>

      <label class="form-field">
        Confirmar nueva contraseña

        <input
          type="password"
          name="new_password_confirmation"
          autocomplete="new-password"
          minlength="12"
          required
        >
      </label>

      <button
        class="button button--primary"
        type="submit"
        data-submit-button
      >
        Guardar contraseña
      </button>
    </form>

    <p
      class="message"
      data-message
      role="alert"
      aria-live="polite"
    ></p>

    <p class="auth-switch">
      <a href="/account">Volver a Mi cuenta</a>
    </p>
  </main>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"
  ></script>

  <script
    type="module"
    src="/assets/js/modules/change-password.js"
  ></script>
</body>
</html>
