<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">

  <title>Recuperar contraseña | EU Tools</title>

  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark" aria-hidden="true">EU</span>
      <span class="auth-card__brand-name">Estrategia Urbana</span>
    </div>

    <p class="eyebrow">Cuenta EU Tools</p>

    <section data-request-section>
      <h1>Recuperar contraseña</h1>

      <p class="auth-card__intro">
        Ingresa el correo asociado a tu cuenta. Si la cuenta está habilitada,
        te enviaremos un enlace temporal.
      </p>

      <form class="form" data-forgot-form novalidate>
        <label class="form-field">
          Correo electrónico

          <input
            type="email"
            name="email"
            autocomplete="email"
            maxlength="190"
            required
          >
        </label>

        <button
          class="button button--primary"
          type="submit"
          data-submit-button
        >
          Enviar enlace de recuperación
        </button>
      </form>

      <p
        class="message"
        data-message
        role="alert"
        aria-live="polite"
      ></p>

      <p class="auth-switch">
        <a href="/login">Volver al inicio de sesión</a>
      </p>
    </section>

    <section
      class="registration-result"
      data-result-section
      hidden
    >
      <div
        class="registration-result__icon"
        aria-hidden="true"
      >
        ✓
      </div>

      <h1>Revisa tu correo</h1>

      <p
        class="auth-card__intro"
        data-result-message
      ></p>

      <div class="registration-result__actions">
        <button
          class="button button--secondary"
          type="button"
          data-try-again
        >
          Usar otro correo
        </button>

        <a
          class="button button--text"
          href="/login"
        >
          Ir al inicio de sesión
        </a>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="/assets/js/modules/forgot-password.js"
  ></script>
</body>
</html>
