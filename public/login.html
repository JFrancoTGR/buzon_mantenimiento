<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Acceso | Plataforma de Mantenimiento</title>
    <link rel="stylesheet" href="./assets/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-card__brand">
        <span class="auth-card__mark" aria-hidden="true">M</span>
        <span class="auth-card__brand-name">Estrategia Urbana</span>
      </div>

      <h1>Plataforma de mantenimiento</h1>
      <p class="auth-card__intro">
        Ingresa con las credenciales asignadas a tu cuenta.
      </p>

      <form class="form" data-login-form novalidate>
        <label class="form-field">
          Correo electrónico
          <input
            type="email"
            name="email"
            autocomplete="username"
            required
            maxlength="190"
          />
        </label>

        <label class="form-field">
          Contraseña
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>

        <button class="button button--primary" type="submit">
          Iniciar sesión
        </button>
      </form>

      <p class="auth-switch">
        ¿No tienes una cuenta?
        <a id="register-link" href="./register.html">Crear cuenta</a>
      </p>

      <p class="message" data-message role="alert" aria-live="polite"></p>
    </main>

    <script type="module" src="./assets/js/modules/login.js"></script>
  </body>
</html>
