<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Recuperar contraseña | Plataforma de Mantenimiento</title>
  <link rel="stylesheet" href="./assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark" aria-hidden="true">M</span>
      <span class="auth-card__brand-name">Estrategia Urbana</span>
    </div>

    <section data-request-section>
      <h1>Recuperar contraseña</h1>
      <p class="auth-card__intro">
        Ingresa el correo electrónico registrado en tu cuenta.
      </p>

      <form class="form" data-forgot-password-form novalidate>
        <label class="form-field">
          Correo electrónico
          <input
            type="email"
            name="email"
            autocomplete="email"
            required
            maxlength="190"
          >
        </label>

        <button class="button button--primary" type="submit" data-submit-button>
          Enviar enlace de recuperación
        </button>
      </form>

      <p class="message" data-message role="alert" aria-live="polite"></p>

      <p class="auth-switch">
        <a href="./login.html">Volver al inicio de sesión</a>
      </p>
    </section>

    <section class="verification-state" data-result-section hidden>
      <div class="verification-state__icon" aria-hidden="true">✓</div>
      <h1>Solicitud recibida</h1>
      <p class="auth-card__intro" data-result-message>
        Si existe una cuenta habilitada asociada con ese correo, recibirás un enlace para restablecer tu contraseña.
      </p>
      <div class="verification-state__actions">
        <a class="button button--primary" href="./login.html">Volver al inicio de sesión</a>
        <button class="button button--text" type="button" data-try-again>Usar otro correo</button>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/js/modules/forgot-password.js"></script>
</body>
</html>
